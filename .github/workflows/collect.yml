# the city-wide ghost audit: during the morning and evening rush hour this calls my live site's
# /api/collect once a minute, so both nta feeds get saved in firestore even when nobody is riding.
# github's schedule can start a few minutes late and can't run more often than every 5 minutes,
# so the schedule only starts the job, and the job itself calls once a minute for the whole peak.
# irish time is utc in winter, so 06:50 utc is 06:50 in dublin.

name: Collect the NTA feeds at rush hour

# the schedule is off: on 24 nov github never started the 06:50 or 15:50 runs, so cron-job.org now calls
# /api/collect every minute at rush hour instead. this stays as a backup i can start by hand.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to collect"
        default: "3"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Call /api/collect once a minute
        env:
          TOKEN: ${{ secrets.COLLECT_TOKEN }}
          MINUTES: ${{ github.event.inputs.minutes || '195' }}
        run: |
          for i in $(seq 1 "$MINUTES"); do
            start=$(date +%s)
            echo "$(date -u +%H:%M:%S) $(curl -s -m 50 -H "authorization: Bearer $TOKEN" https://ghost-bus-a3.vercel.app/api/collect)"
            # wait out the rest of the minute, so the calls stay one minute apart
            sleep $(( 60 - ($(date +%s) - start) ))
          done
